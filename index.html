<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f7f3ea">
  <title>贴纸叠叠乐</title>
  <style>
    :root{--ink:#26302d;--muted:#68736e;--cream:#f7f3ea;--paper:#fffdf8;--accent:#ef765f;--mint:#74ad98;--line:#ddd7ca}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
    body{min-height:100dvh;background:radial-gradient(circle at 15% 0,#fff 0,transparent 28%),linear-gradient(145deg,#f8f4eb,#efe9dc)}
    button{font:inherit;color:inherit}
    .app{height:100dvh;max-width:1180px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(260px,340px) minmax(320px,560px);gap:clamp(14px,3vw,34px);justify-content:center;align-items:center}
    .panel{display:flex;flex-direction:column;gap:18px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:18px;background:var(--accent);color:white;font-size:27px;box-shadow:0 8px 22px #ef765f3b;transform:rotate(-3deg)}
    h1{font-size:clamp(26px,4vw,40px);line-height:1;margin:0;letter-spacing:-.04em}.tagline{margin:5px 0 0;color:var(--muted);font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px 8px;border:1px solid #e5dfd2;border-radius:16px;background:#fffaf2b8;text-align:center}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}.next-icon{height:26px;line-height:26px}.next-icon img,.pill strong img{width:26px;height:26px;object-fit:cover;border-radius:50%;border:2px solid white;vertical-align:middle;box-shadow:0 2px 6px #26302d2a}
    .card{background:#fffaf2a8;border:1px solid #e5dfd2;border-radius:18px;padding:14px}.card-title{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:white;border:2px solid white;overflow:hidden;filter:saturate(.65);opacity:.46;transition:.2s;box-shadow:0 3px 10px #3d564c13}.level img{width:100%;height:100%;object-fit:cover;display:block}.level.on{filter:none;opacity:1;outline:2px solid #ef765f42}.level::after{content:attr(data-level);position:absolute;right:4px;bottom:3px;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:9px;font-weight:800;color:white;background:#26302dcc}
    .tip{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:12px;line-height:1.5}.tip b{color:var(--accent);font-size:15px}.controls{display:flex;gap:9px}.btn{border:1px solid #ddd6c8;background:#fffdf8;border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 0 #ddd6c8;transition:.12s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px);box-shadow:none}.btn.primary{flex:1;color:white;background:var(--ink);border-color:var(--ink);box-shadow:0 2px 0 #111715}
    .game-wrap{--danger-y:22%;position:relative;width:min(100%,560px);height:min(calc(100dvh - 24px),820px);min-height:500px;border-radius:28px;overflow:hidden;background:linear-gradient(#e6f2ee 0 var(--danger-y),#f9f6ee var(--danger-y));border:1px solid #d4d4c9;box-shadow:0 22px 60px #3c4a4324,0 2px 0 #cbc6ba;touch-action:none;isolation:isolate}
    .game-wrap::before{content:"";position:absolute;top:var(--danger-y);left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#e85049 0 14px,#ff9b88 14px 22px);box-shadow:0 1px 0 #fff9;opacity:.94;z-index:2;pointer-events:none}.game-wrap::after{content:"警戒线 · 超过即失败";position:absolute;top:calc(var(--danger-y) - 21px);left:11px;padding:3px 8px;border-radius:8px 8px 0 0;background:#e85049;color:white;font-size:10px;font-weight:800;letter-spacing:0;z-index:2;pointer-events:none}.game-wrap.danger::before,.game-wrap.danger::after{animation:pulse .32s infinite alternate}@keyframes pulse{to{filter:brightness(1.35);opacity:.72}}
    canvas{display:block;width:100%;height:100%}.drop-note{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#57736a;letter-spacing:.08em;pointer-events:none;white-space:nowrap}
    .pause-chip{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;border-radius:12px;background:#ffffffb8;backdrop-filter:blur(8px);cursor:pointer;z-index:3}.toast{position:absolute;top:23%;left:50%;transform:translate(-50%,-10px);padding:8px 13px;color:white;background:#26302dda;border-radius:99px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    .overlay{position:absolute;inset:0;z-index:10;display:none;place-items:center;padding:25px;background:#26302d99;backdrop-filter:blur(5px)}.overlay.show{display:grid}.dialog{width:min(100%,350px);padding:25px;border-radius:24px;background:#fffdf8;text-align:center;box-shadow:0 20px 60px #1018164a}.dialog .hero{font-size:52px}.dialog h2{margin:8px 0 6px;font-size:28px}.dialog p{margin:0 0 18px;color:var(--muted);line-height:1.6}.dialog .btn{width:100%}
    .mobile-title{display:none}
    @media(max-width:760px){.app{display:flex;flex-direction:column;padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:7px}.panel{display:none}.mobile-title{height:52px;width:min(100%,560px);display:flex;align-items:center;gap:8px}.mobile-title .logo{width:38px;height:38px;border-radius:12px;font-size:20px}.mobile-title h1{font-size:20px;flex:1}.mobile-stats{display:flex;gap:6px}.pill{min-width:62px;padding:6px 9px;border:1px solid #ddd7ca;border-radius:12px;background:#fffaf0;text-align:center}.pill span{display:block;font-size:8px;color:var(--muted)}.pill strong{font-size:14px}.game-wrap{flex:1;min-height:0;height:auto;border-radius:22px}}
    @media(max-width:380px){.pill{min-width:55px;padding:5px 6px}.mobile-title{height:46px}.game-wrap{border-radius:18px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <div class="brand"><div class="logo">✦</div><div><h1>贴纸叠叠乐</h1><p class="tagline">让珍藏的瞬间，越合越大。</p></div></div>
      <div class="stats">
        <div class="stat"><span>分数</span><strong id="score">0</strong></div>
        <div class="stat"><span>最高</span><strong id="best">0</strong></div>
        <div class="stat"><span>下一张</span><strong class="next-icon" id="nextIcon"></strong></div>
      </div>
      <section class="card"><div class="card-title"><span>贴纸升级路线</span><span id="progressText">1 / 9</span></div><div class="ladder" id="ladder"></div></section>
      <div class="tip"><b>↔</b><span>移动鼠标或手指选择落点，点击即可投放。电脑也可用方向键和空格。</span></div>
      <div class="controls"><button class="btn primary" id="restartBtn">重新开始</button><button class="btn" id="soundBtn" aria-label="声音开关">声音 · 开</button></div>
    </aside>

    <div class="mobile-title"><div class="logo">✦</div><h1>贴纸叠叠乐</h1><div class="mobile-stats"><div class="pill"><span>分数</span><strong id="mobileScore">0</strong></div><div class="pill"><span>下一张</span><strong id="mobileNext"></strong></div></div></div>

    <section class="game-wrap" id="gameWrap" aria-label="贴纸叠叠乐游戏区">
      <canvas id="game"></canvas><div class="drop-note">移动 · 点击投放</div>
      <button class="pause-chip" id="pauseBtn" aria-label="暂停游戏">Ⅱ</button><div class="toast" id="toast"></div>
      <div class="overlay" id="overlay"><div class="dialog"><div class="hero" id="dialogHero">📦</div><h2 id="dialogTitle">先歇一下</h2><p id="dialogText"></p><button class="btn primary" id="dialogBtn">继续游戏</button></div></div>
    </section>
  </main>

    function burst(x,y,color,n=11){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.65+Math.random()*.25,size:2+Math.random()*5,color})}}
    function merge(a,b){if(a.dead||b.dead||a.level!==b.level||a.level>=ITEMS.length-1)return;a.dead=b.dead=true;const nl=a.level+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;const o=spawn(nl,x,y,true);o.vx=(a.vx+b.vx)*.28;o.vy=-Math.min(260,105+nl*14);o.squash=.9;burst(x,y,ITEMS[nl][1],14+nl);shake=Math.min(11,3+nl*.55);addScore(nl);if(nl>maxLevel){maxLevel=nl;showToast(`解锁 ${ITEMS[nl][0]}！`)}beep(330+nl*48,.13,'sine',.05);if(nl===ITEMS.length-1){won=true;setTimeout(()=>finish(true),800)}}
    function physics(dt){protectedPlayTime+=dt;const gravity=W<=760?1420:1350;objects.forEach(o=>{o.age+=dt;o.flash=Math.max(0,o.flash-dt*2.8);o.squash=Math.max(0,o.squash-dt*4.6);o.vy+=gravity*dt;o.vx*=Math.pow(.995,dt*60);o.vy*=Math.pow(.998,dt*60);o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;if(o.x-o.r<0){o.x=o.r;o.vx=Math.abs(o.vx)*.68;o.vr+=.18;o.squash=Math.min(1,Math.abs(o.vx)/280)}if(o.x+o.r>W){o.x=W-o.r;o.vx=-Math.abs(o.vx)*.68;o.vr-=.18;o.squash=Math.min(1,Math.abs(o.vx)/280)}if(o.y+o.r>H){o.y=H-o.r;o.squash=Math.min(1,Math.abs(o.vy)/360);o.vy=-Math.abs(o.vy)*.48;o.vx*=.94;o.vr*=.92;if(Math.abs(o.vy)<22)o.vy=0}});
      for(let pass=0;pass<3;pass++)for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const a=objects[i],b=objects[j];if(a.dead||b.dead)continue;let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.01,min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&a.age>.1&&b.age>.1&&a.level<ITEMS.length-1){merge(a,b);continue}const nx=dx/dist,ny=dy/dist,over=min-dist,total=a.r+b.r;a.x-=nx*over*(b.r/total);a.y-=ny*over*(b.r/total);b.x+=nx*over*(a.r/total);b.y+=ny*over*(a.r/total);const rvx=b.vx-a.vx,rvy=b.vy-a.vy,sep=rvx*nx+rvy*ny;if(sep<0){const imp=-(1.72)*sep/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;const hit=Math.min(1,Math.abs(sep)/350);a.squash=Math.max(a.squash,hit);b.squash=Math.max(b.squash,hit)}}
      objects=objects.filter(o=>!o.dead);
      particles.forEach(p=>{p.life-=dt;p.vy+=350*dt;p.x+=p.vx*dt;p.y+=p.vy*dt});particles=particles.filter(p=>p.life>0);
      const dangerY=H*.22,unsafe=objects.some(o=>o.age>.75&&o.y-o.r<dangerY&&Math.abs(o.vy)<130),protectedTime=protectedPlayTime<PROTECTED_PLAY_SECONDS;dangerFor=unsafe?Math.min(protectedTime?.65:9,dangerFor+dt):Math.max(0,dangerFor-dt*2.8);wrap.classList.toggle('danger',dangerFor>.18);if(!protectedTime&&dangerFor>1.5&&!won)finish(false)
    }
    function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function drawObject(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);const sq=o.squash||0;ctx.scale(1+sq*.11,1-sq*.08);const r=o.r,img=STICKERS[o.level],c=ITEMS[o.level][1];ctx.shadowColor='#26302d45';ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.save();ctx.beginPath();ctx.arc(0,0,r-2,0,Math.PI*2);ctx.clip();if(img&&img.complete&&img.naturalWidth){const iw=img.naturalWidth,ih=img.naturalHeight,side=Math.min(iw,ih),sx=(iw-side)/2,sy=(ih-side)/2;ctx.drawImage(img,sx,sy,side,side,-r,-r,r*2,r*2)}else{ctx.fillStyle=c;ctx.fillRect(-r,-r,r*2,r*2)}const g=ctx.createLinearGradient(0,-r,0,r);g.addColorStop(0,'#ffffff24');g.addColorStop(.58,'#ffffff00');g.addColorStop(1,'#26302d26');ctx.fillStyle=g;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(3,r*.09);ctx.beginPath();ctx.arc(0,0,r-1,0,Math.PI*2);ctx.stroke();if(o.flash){ctx.globalAlpha=o.flash*.48;ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.fill()}ctx.restore()}
    function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>.1){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}
      ctx.fillStyle='#ffffff17';for(let y=H*.25;y<H;y+=52){ctx.beginPath();ctx.arc(24+(y%104),y,2.2,0,7);ctx.fill()}
      if(!paused&&!ended){const r=radius(currentLevel),x=Math.max(r+2,Math.min(W-r-2,aimX||W/2));ctx.save();ctx.globalAlpha=.62;ctx.setLineDash([4,6]);ctx.strokeStyle='#668a7e';ctx.beginPath();ctx.moveTo(x,28);ctx.lineTo(x,H*.22-5);ctx.stroke();ctx.restore();drawObject({x,y:Math.max(42,r+7),r,level:currentLevel,rot:0,flash:0})}
      [...objects].sort((a,b)=>a.y-b.y).forEach(drawObject);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.restore()}
    function loop(t){const dt=Math.min(.025,(t-lastTime)/1000||0);lastTime=t;if(!paused&&!ended)physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
    function setAim(clientX){const r=wrap.getBoundingClientRect();aimX=Math.max(0,Math.min(W,clientX-r.left))}
    wrap.addEventListener('pointermove',e=>setAim(e.clientX));wrap.addEventListener('pointerdown',e=>{if(e.target.closest('button')||overlay.classList.contains('show'))return;setAim(e.clientX);drop()});
    window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){aimX-=24;e.preventDefault()}if(e.key==='ArrowRight'){aimX+=24;e.preventDefault()}if(e.code==='Space'||e.key==='ArrowDown'){drop();e.preventDefault()}if(e.key.toLowerCase()==='p')togglePause()});
    function showToast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),1450)}
    function togglePause(){if(ended)return;paused=!paused;$('#pauseBtn').textContent=paused?'▶':'Ⅱ';if(paused){$('#dialogHero').textContent='✦';$('#dialogTitle').textContent='休息一下';$('#dialogText').textContent='贴纸们也暂停了，随时回来继续。';$('#dialogBtn').textContent='继续游戏';overlay.classList.add('show')}else overlay.classList.remove('show')}
    function finish(isWin){if(ended)return;ended=true;paused=false;$('#dialogHero').textContent=isWin?'★':'✦';$('#dialogTitle').textContent=isWin?'珍藏集齐啦！':'空间装满啦';$('#dialogText').textContent=isWin?`你合成了终级花田写真，最终得分 ${score}。`:`这次得到 ${score} 分，最高合成到「${ITEMS[maxLevel][0]}」。`;$('#dialogBtn').textContent='再玩一局';overlay.classList.add('show');beep(isWin?660:160,.35,isWin?'sine':'sawtooth',.04)}
    function restart(){objects=[];particles=[];score=0;maxLevel=0;currentLevel=0;nextLevel=pickLevel();dangerFor=0;ended=false;won=false;paused=false;lastDrop=0;protectedPlayTime=0;overlay.classList.remove('show');wrap.classList.remove('danger');$('#pauseBtn').textContent='Ⅱ';updateHud();showToast('新的一局，开始合成！')}
    $('#pauseBtn').onclick=togglePause;$('#restartBtn').onclick=()=>{if(confirm('重新开始这一局吗？'))restart()};$('#dialogBtn').onclick=()=>ended?restart():togglePause();$('#soundBtn').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=`声音 · ${soundOn?'开':'关'}`;if(soundOn)beep()};
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!ended)togglePause()});updateHud();
  })();
  </script>
